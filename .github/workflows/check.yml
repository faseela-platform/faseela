name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types, lint, deep-module boundaries, tests, and production builds.
      # `next build` prerenders the ISR /masarat page and statically optimizes the
      # /api/v1 route handlers, both of which read the database at build time — the
      # same reads Vercel's build performs. So the build step needs a connection
      # string, supplied here from repo secrets (read-only use). Tests do not: they
      # run against in-memory PGlite.
      - run: pnpm check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
